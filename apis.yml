aid: astrix-security
name: Astrix Security
description: >-
  Astrix Security is a cybersecurity company providing identity security for AI
  agents and non-human identities (NHIs) — the API keys, OAuth apps, service
  accounts, SSH keys, and MCP servers that fall outside traditional human IAM.
  Its platform lets enterprises discover a real-time inventory of every AI agent
  and NHI with business and risk context, secure them by remediating excessive
  privileges, misconfigurations, and abnormal or malicious activity, and deploy
  agentic AI safely via an Agent Control Plane that provisions short-lived,
  tightly scoped credentials. Founded by Alon Jackson and Idan Gour and
  headquartered in Boston, Astrix is backed by CRV, Bessemer Venture Partners,
  Menlo Ventures, F2, and Anthropic. The company was acquired by Cisco and ended
  standalone sales of new licenses effective June 30, 2026.
